[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conjectra"
version = "0.1.0"
description = "A zero-token control plane for multi-goal autonomous research: hypotheses in, audited evidence out."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Conjectra contributors" }]
keywords = [
    "autonomous-research",
    "ai-agents",
    "llm",
    "orchestration",
    "hyperqueue",
    "experiment-tracking",
    "falsification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/xixilys/conjectra"
Documentation = "https://github.com/xixilys/conjectra/tree/main/docs"
Issues = "https://github.com/xixilys/conjectra/issues"

[project.scripts]
conjectra = "conjectra.cli:main"

# Third-party plugins register here, e.g. in their own pyproject.toml:
# [project.entry-points."conjectra.backends"]
# mybackend = "my_pkg.backend:MyBackend"
# [project.entry-points."conjectra.adapters"]
# myproject = "my_pkg.adapter:MyAdapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["conjectra*"]

[tool.setuptools.package-data]
conjectra = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Correctness-focused rule set (pyflakes + syntax errors). Style is not enforced yet.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
