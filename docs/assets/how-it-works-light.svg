<rect x="454" y="132" width="58" height="32" rx="16.0" fill="#ffffff" stroke="#1f2328" stroke-opacity="0.35"/><text x="483.0" y="152.68" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#1f2328" text-anchor="middle" >fence</text>
