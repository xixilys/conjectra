<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="How Conjectra works: a zero-token controller dispatches single-attempt jobs and records every result in an append-only evidence ledger">
<defs>
