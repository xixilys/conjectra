<marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4cf0"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1279" height="599" rx="20" fill="#ffffff" stroke="#d0d7de"/>
<rect x="40" y="60" width="230" height="250" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >You, or an agent</text>
