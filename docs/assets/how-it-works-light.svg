<text x="60" y="160" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >$ conjectra submit-goal</text>
<text x="60" y="190" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >$ conjectra intervene</text>
<text x="60" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >$ conjectra overview</text>
<text x="60" y="250" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >$ conjectra inspect</text>
<text x="60" y="280" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >$ conjectra takeover</text>
