<line x1="686" y1="148" x2="698" y2="148" stroke="#59636e" stroke-width="2" marker-end="url(#arr-m)"/>
<rect x="700" y="132" width="90" height="32" rx="16.0" fill="#ffffff" stroke="#1f2328" stroke-opacity="0.35"/><text x="745.0" y="152.68" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#1f2328" text-anchor="middle" >reconcile</text>
<circle cx="370" cy="205" r="3.5" fill="#5b4cf0"/>
<text x="384" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Fair-shares one worker pool across many goals</text>
<circle cx="370" cy="233" r="3.5" fill="#5b4cf0"/>
<text x="384" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Rejects late results with a stale goal_version / human_epoch</text>
<circle cx="370" cy="261" r="3.5" fill="#5b4cf0"/>
<text x="384" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Spawns ablation + falsification for every confirmed result</text>
<circle cx="370" cy="289" r="3.5" fill="#5b4cf0"/>
<text x="384" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Sends refuted routes to a graveyard that blocks repeats</text>
<rect x="920" y="60" width="320" height="250" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="940" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start" >Single-attempt jobs</text>
<text x="940" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >isolated git worktree · pinned model · timeout</text>
<rect x="940" y="140" width="49" height="24" rx="12.0" fill="#f6f8fa" stroke="#1f2328" stroke-opacity="0.35"/><text x="964.5" y="156.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >CODE</text>
<rect x="997" y="140" width="79" height="24" rx="12.0" fill="#fff8c5" stroke="#9a6700" stroke-opacity="0.35"/><text x="1036.5" y="156.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#9a6700" text-anchor="middle" >CPU_GATE</text>
<rect x="1084" y="140" width="101" height="24" rx="12.0" fill="#ebe8ff" stroke="#5b4cf0" stroke-opacity="0.35"/><text x="1134.5" y="156.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#5b4cf0" text-anchor="middle" >IMPL_REVIEW</text>
<rect x="940" y="172" width="94" height="24" rx="12.0" fill="#fff8c5" stroke="#9a6700" stroke-opacity="0.35"/><text x="987.0" y="188.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#9a6700" text-anchor="middle" >EXP_SCREEN</text>
<rect x="1042" y="172" width="101" height="24" rx="12.0" fill="#fff8c5" stroke="#9a6700" stroke-opacity="0.35"/><text x="1092.5" y="188.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#9a6700" text-anchor="middle" >EXP_CONFIRM</text>
<rect x="940" y="204" width="116" height="24" rx="12.0" fill="#ebe8ff" stroke="#5b4cf0" stroke-opacity="0.35"/><text x="998.0" y="220.32" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#5b4cf0" text-anchor="middle" >RESULT_REVIEW</text>
<text x="940" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Backends: Claude Code · Codex · Gemini ·</text>
<text x="940" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >OpenAI-compatible · any CLI · your plugin</text>
<text x="940" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5b4cf0" text-anchor="start" >Reviews go to a different model family</text>
<rect x="40" y="400" width="1200" height="160" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="64" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" >Append-only evidence ledger</text>
<text x="64" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >SQLite WAL · one EvidenceReceipt per job · engineering / scientific / audit verdicts kept apart</text>
<rect x="64" y="484" width="98" height="30" rx="15.0" fill="#dafbe1" stroke="#1a7f37" stroke-opacity="0.35"/><text x="113.0" y="504.04" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1a7f37" text-anchor="middle" >CONFIRMED</text>
<rect x="174" y="484" width="80" height="30" rx="15.0" fill="#ffebe9" stroke="#cf222e" stroke-opacity="0.35"/><text x="214.0" y="504.04" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#cf222e" text-anchor="middle" >REFUTED</text>
<rect x="266" y="484" width="80" height="30" rx="15.0" fill="#eaeef2" stroke="#6e7781" stroke-opacity="0.35"/><text x="306.0" y="504.04" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#6e7781" text-anchor="middle" >UNKNOWN</text>
<text x="368" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >← scientific verdicts</text>
<text x="64" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >INFRA_TRANSIENT · ENV_CONFIG_MISMATCH · ENGINEERING_DEFECT are failure domains, never recorded as REFUTED; passing tests alone never counts as CONFIRMED.</text>
<line x1="270" y1="150" x2="338" y2="150" stroke="#5b4cf0" stroke-width="2" marker-end="url(#arr-a)"/><text x="304.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle" >atomic tx</text>
